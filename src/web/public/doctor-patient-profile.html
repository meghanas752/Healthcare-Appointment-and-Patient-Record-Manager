<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient History</title>
  <!-- Make sure this path is correct -->
  <link rel="stylesheet" href="css/history.css">
  <!-- Adding an icon library for the sidebar -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>

  <!-- 1. The Sidebar (from your inspiration) -->
  <div class="sidebar">
    <div class="sidebar-header">
      <i class="fas fa-hospital"></i>
      <h3>HMPRS</h3>
    </div>
    <ul class="sidebar-nav">
      <!-- We make 'Search Patient' the active link -->
      <li class="active"><a href="#"><i class="fas fa-search"></i> Search Patient</a></li>
      <!-- <li><a href="#"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li> -->
      <li><a href="my-appointments.html"><i class="fas fa-calendar-check"></i> My Appointments</a></li>
    </ul>
    <div class="sidebar-footer">
      <p>Signed in as</p>
      <strong>Dr. Megha</strong>
      <a href="#" id="logout-button">Logout</a>
    </div>
  </div>

  <!-- 2. The Main Content Area -->
  <div class="main-content">
    
    <!-- Header with Search Bar -->
    <div class="content-header">
      <h1>Patient History Search</h1>
      <p>Enter a patient's full name to retrieve their medical records.</p>
      <div class="search-container">
        <input type="text" id="patient-name-input" placeholder="Enter patient's full name...">
        <button id="search-button"><i class="fas fa-search"></i> Search</button>
      </div>
    </div>

    <!-- This section will be hidden until a search is successful -->
    <div id="results-container" class="hidden">

      <!-- 3. Stat Cards (like 'Net Worth') -->
      <h2 id="patient-name-display"></h2>
      <div class="stats-container">
        <div class="stat-card">
          <p>Last Visit</p>
          <strong id="stat-last-visit">--</strong>
        </div>
        <div class="stat-card allergy-card">
          <p>Known Allergies</p>
          <strong id="stat-allergies">--</strong>
        </div>
        <div class="stat-card">
          <p>Total Records</p>
          <strong id="stat-total-records">--</strong>
        </div>
      </div>

      <!-- 4. History List (like 'Assets Summary') -->
      <div class="history-section">
        <h3>Complete Medical History</h3>
        <div id="history-loading"></div>
        <div id="history-list">
          <!-- History items will be injected here by JavaScript -->
        </div>
      </div>

      
      <!-- ******* THIS IS THE NEW SECTION YOU WERE MISSING ******* -->
      <div id="prescription-section" class="history-section">
        <h3>Write New Prescription</h3>
        <form id="prescription-form">
          <div class="form-group">
            <label for="prescription-details">Prescription Details (e.g., "Amoxicillin 500mg, 2x/day for 7 days")</label>
            <textarea id="prescription-details" rows="5"></textarea>
          </div>
          <button type="submit" class="submit-button">Save Prescription</button>
          <div id="prescription-message" class="hidden"></div>
        </form>
      </div>
      <!-- ******* END OF NEW SECTION ******* -->


    </div> <!-- /results-container -->

  </div> <!-- /main-content -->

  <!-- Make sure this path is correct for your project -->
  <script src="scripts/history.js"></script>
</body>
</html>
